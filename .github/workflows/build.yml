name: Build libVCTracerMenu.so
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (armeabi-v7a)
        run: |
          export NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          chmod +x build.sh
          ./build.sh
          file libVCTracerMenu.so
      - uses: actions/upload-artifact@v4
        with:
          name: libVCTracerMenu
          path: libVCTracerMenu.so
